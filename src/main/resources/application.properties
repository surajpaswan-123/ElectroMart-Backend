app.jwt.secret=${JWT_SECRET:ElectroMart-Dev-Secret-Key-Min32CharsRequired-ChangeInProduction}
spring.application.name=ElectroMart

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/electromart}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=${PORT:8091}
# CORS (Frontend ka URL dalo)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# OTP Configuration
app.otp.expiry-minutes=10
app.otp.max-attempts=5
